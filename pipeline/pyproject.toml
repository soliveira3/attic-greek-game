[project]
name = "attic-greek-pipeline"
version = "1.0.0"
description = "Builds the game's paradigm data from Wiktionary (kaikki.org) and cross-checks it with Morpheus"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
extend-exclude = ["raw"]

[tool.ruff.lint]
# ruff's default rules, minus the dict() call style (dict(key=...) reads better for test fixtures)
ignore = ["C408"]
