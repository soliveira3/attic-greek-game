# Runs every test suite (scripts/check.sh) on each push and pull request, and deploys the built
# site to GitHub Pages from main. Pages must be enabled with "GitHub Actions" as the source.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Pipeline environment
        run: |
          python -m venv pipeline/.venv
          pipeline/.venv/bin/pip install -r pipeline/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: App dependencies
        working-directory: app
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: All checks (lint, pytest, vitest with coverage, typecheck, Playwright)
        run: bash scripts/check.sh
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            app/playwright-report/
            app/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build
        working-directory: app
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: app/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
